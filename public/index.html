<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse — Modern Social Media Platform</title>
    <meta name="description" content="Connect, share ideas, and explore trending tech & design posts on Pulse Social Platform.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom Design System Stylesheet -->
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- TOP NAVBAR -->
    <header class="top-navbar">
        <div class="brand-logo" onclick="App.switchView('home')" style="cursor: pointer;">
            <div class="logo-icon">
                <i class="fas fa-bolt"></i>
            </div>
            <span class="brand-title">Pulse</span>
        </div>

        <div class="search-bar-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Search posts, hashtags, or people...">
        </div>

        <div class="header-actions">
            <button class="icon-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
                <i class="fas fa-sun"></i>
            </button>

            <button class="icon-btn" onclick="App.switchView('notifications')" title="Notifications">
                <i class="far fa-bell"></i>
                <span class="badge-count" id="unread-notif-badge" style="display: none;">3</span>
            </button>

            <button class="btn-primary" id="nav-login-btn" onclick="App.openModal('auth-modal')">
                <i class="fas fa-sign-in-alt"></i> Login / Register
            </button>
        </div>
    </header>

    <!-- MAIN APP CONTAINER -->
    <div class="app-container">

        <!-- LEFT SIDEBAR NAV -->
        <aside class="left-sidebar">
            <nav class="sidebar-nav">
                <button class="nav-item active" data-view="home">
                    <i class="fas fa-house"></i>
                    <span class="nav-label">Home</span>
                </button>
                
                <button class="nav-item" data-view="explore">
                    <i class="fas fa-compass"></i>
                    <span class="nav-label">Explore</span>
                </button>

                <button class="nav-item" data-view="notifications">
                    <i class="fas fa-bell"></i>
                    <span class="nav-label">Notifications</span>
                </button>

                <button class="nav-item" data-view="saved">
                    <i class="fas fa-bookmark"></i>
                    <span class="nav-label">Saved</span>
                </button>

                <button class="nav-item" data-view="profile">
                    <i class="fas fa-user"></i>
                    <span class="nav-label">Profile</span>
                </button>
            </nav>

            <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="document.getElementById('post-textarea').focus()">
                <i class="fas fa-pen-nib"></i> <span class="nav-label">Create Post</span>
            </button>

            <!-- CURRENT USER PROFILE SUMMARY -->
            <div class="user-profile-summary" id="sidebar-user-summary" onclick="App.switchView('profile')" style="display: none;">
                <img src="" class="avatar" alt="Avatar">
                <div class="user-info">
                    <div class="name">User</div>
                    <div class="handle">@username</div>
                </div>
                <button id="nav-logout-btn" onclick="event.stopPropagation(); Auth.logout();" style="color: var(--text-muted);" title="Logout">
                    <i class="fas fa-sign-out-alt"></i>
                </button>
            </div>
        </aside>

        <!-- CENTER MAIN FEED COLUMN -->
        <main class="main-feed">

            <!-- USER PROFILE HEADER VIEW (Hidden by default, shown on Profile tab) -->
            <section id="profile-header-container" style="display: none;"></section>

            <!-- NOTIFICATIONS CONTAINER VIEW (Hidden by default) -->
            <section id="notifications-container" style="display: none;"></section>

            <!-- FEED TABS -->
            <div class="feed-header-tabs" id="feed-tabs">
                <div class="tab-btn active" data-feed="explore">Explore</div>
                <div class="tab-btn" data-feed="home">Following Feed</div>
                <div class="tab-btn" data-feed="saved">Bookmarked</div>
            </div>

            <!-- CREATE POST CARD -->
            <div class="create-post-card" id="create-post-card">
                <div class="create-post-header">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=400&q=80" id="creator-avatar" class="avatar" alt="Creator Avatar">
                    <textarea class="post-textarea" id="post-textarea" placeholder="What's happening on your mind? Share thoughts, code or inspiration..."></textarea>
                </div>

                <div class="image-preview-container" id="image-preview-container">
                    <img src="" id="preview-img" alt="Preview Image">
                    <button class="remove-img-btn" id="remove-img-btn"><i class="fas fa-times"></i></button>
                </div>

                <div class="create-post-actions">
                    <div class="media-tools">
                        <input type="file" id="post-media-input" accept="image/*" style="display: none;">
                        <button class="tool-btn" id="post-media-btn">
                            <i class="far fa-image"></i> Photo
                        </button>
                        <button class="tool-btn" onclick="document.getElementById('post-textarea').value += ' #WebDev '">
                            <i class="fas fa-hashtag"></i> Tag
                        </button>
                        <button class="tool-btn" onclick="document.getElementById('post-textarea').value += ' 🚀 '">
                            <i class="far fa-smile"></i> Emoji
                        </button>
                    </div>

                    <button class="btn-primary" id="publish-post-btn">
                        <i class="fas fa-paper-plane"></i> Post
                    </button>
                </div>
            </div>

            <!-- POSTS STREAM CONTAINER -->
            <section class="posts-stream" id="posts-stream-container">
                <!-- Posts populated dynamically by App.js -->
            </section>

        </main>

        <!-- RIGHT SIDEBAR WIDGETS -->
        <aside class="right-sidebar">

            <!-- DEMO ACCOUNTS SWITCHER WIDGET -->
            <div class="widget-card">
                <div class="widget-title">
                    <span>⚡ Quick Test Login</span>
                    <span style="font-size: 0.75rem; color: var(--primary-color); font-weight: 600;">1-Click Switch</span>
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;">
                    Click any seeded account below to test multi-user posts, follow graph & comments:
                </div>
                <div id="demo-users-list">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- SUGGESTED PEOPLE WIDGET -->
            <div class="widget-card">
                <div class="widget-title">
                    <span>Who to Follow</span>
                </div>
                <div id="suggested-users-widget">
                    <!-- Populated dynamically -->
                </div>
            </div>

            <!-- TRENDING HASHTAGS WIDGET -->
            <div class="widget-card">
                <div class="widget-title">
                    <span>Trending Topics</span>
                </div>
                <div id="trending-hashtags-widget">
                    <!-- Populated dynamically -->
                </div>
            </div>

        </aside>

    </div>

    <!-- ==========================================
         MODALS
         ========================================== -->

    <!-- AUTH MODAL (Login / Register) -->
    <div class="modal-backdrop" id="auth-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Welcome to Pulse</h3>
                <button class="close-modal-btn" onclick="App.closeModal('auth-modal')"><i class="fas fa-times"></i></button>
            </div>

            <div class="feed-header-tabs" style="margin-bottom: 16px;">
                <div class="tab-btn active" id="tab-show-login" onclick="
                    document.getElementById('login-form').style.display='block';
                    document.getElementById('signup-form').style.display='none';
                    this.classList.add('active');
                    document.getElementById('tab-show-signup').classList.remove('active');
                ">Login</div>
                <div class="tab-btn" id="tab-show-signup" onclick="
                    document.getElementById('login-form').style.display='none';
                    document.getElementById('signup-form').style.display='block';
                    this.classList.add('active');
                    document.getElementById('tab-show-login').classList.remove('active');
                ">Register</div>
            </div>

            <!-- LOGIN FORM -->
            <form id="login-form">
                <div class="form-group">
                    <label>Username or Email</label>
                    <input type="text" id="login-identifier" class="form-control" placeholder="e.g. alexrivers or alex@pulse.io" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 14px;">Sign In</button>
            </form>

            <!-- SIGNUP FORM -->
            <form id="signup-form" style="display: none;">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="signup-name" class="form-control" placeholder="e.g. Alex Rivers" required>
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signup-username" class="form-control" placeholder="e.g. alexrivers" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="signup-email" class="form-control" placeholder="alex@pulse.io" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" class="form-control" placeholder="••••••••" required>
                </div>
                <div class="form-group">
                    <label>Bio (Optional)</label>
                    <input type="text" id="signup-bio" class="form-control" placeholder="Tell us about yourself...">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 14px;">Create Account</button>
            </form>
        </div>
    </div>

    <!-- EDIT PROFILE MODAL -->
    <div class="modal-backdrop" id="edit-profile-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Edit Profile</h3>
                <button class="close-modal-btn" onclick="App.closeModal('edit-profile-modal')"><i class="fas fa-times"></i></button>
            </div>

            <form id="edit-profile-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="edit-fullname" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Bio</label>
                    <textarea id="edit-bio" class="form-control" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Avatar URL</label>
                    <input type="text" id="edit-avatar" class="form-control">
                </div>
                <div class="form-group">
                    <label>Cover Banner URL</label>
                    <input type="text" id="edit-cover" class="form-control">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; margin-top: 14px;">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Application Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
